name: Build and push to Docker Hub image latest

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            -   name: Checkout repository
                uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
                id: checkout

            -   name: Setup Python
                uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
                with:
                    python-version: 3.12

            -   name: Install dependencies with poetry
                run: |
                    sudo apt update
                    sudo apt install libpq-dev
                    pip install poetry

            -   run: poetry install --with dev

            -   run: poetry run isort --profile black --diff dblinter/ tests/

            -   run: poetry run black --check .

            -   run: poetry run ruff check .

            -   run: poetry run pylint dblinter tests

            -   run: poetry run pytest --cov=dblinter --cov-report=xml --cov-branch --cov-report term-missing

            -   name: Upload results to Codecov
                uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}

            -   name: Login to Docker Hub
                uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: Build and push
                uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
                with:
                    push: true
                    tags: decathlon/dblinter:develop
