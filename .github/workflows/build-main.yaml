name: Build and push to Docker Hub image latest

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                id: checkout

            -   name: Setup Python
                uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
                with:
                    python-version: 3.12

            -   name: Install dependencies with poetry
                run: |
                    sudo apt update
                    sudo apt install libpq-dev
                    pip install poetry

            -   run: poetry install --with dev

            -   run: poetry run isort --profile black --diff dblinter/ tests/

            -   run: poetry run black --check .

            -   run: poetry run ruff check .

            -   run: poetry run pylint dblinter tests

            -   run: poetry run pytest --cov=dblinter --cov-report=xml --cov-branch --cov-report term-missing

            -   name: Upload results to Codecov
                uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}

            -   name: Login to Docker Hub
                uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: Build and push
                uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
                with:
                    push: true
                    tags: decathlon/dblinter:develop
